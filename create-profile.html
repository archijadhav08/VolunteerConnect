<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Profile</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<h2>Create Volunteer Profile</h2>

<form id="profileForm">

    <input id="name" type="text" placeholder="Full Name" required>

    <input id="location" type="text" placeholder="Location" required>

    <input id="skills" type="text" placeholder="Skills" required>

    <input id="interests" type="text" placeholder="Interests" required>

    <textarea id="about" placeholder="About You"></textarea>

    <button type="submit" class="btn">
        Save Profile
    </button>

</form>

<script src="js/app.js"></script>

</body>
</html>
